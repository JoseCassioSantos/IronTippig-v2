<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="src/icons/relogio-alarma.png" type="image/x-icon">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/main.css">
  <script defer src="./script/script.js"></script>
  <script defer src="./script/auth.js"></script>
  <title>Iron Tipping</title>
</head>

<body>
  <!-- Aplicação principal (exibida diretamente, sem login) -->
  <div id="app">
    <header id="header">
      <a href="#" class="brand" onclick="event.preventDefault(); openNav()">
        <div class="mark">&#x1F680;</div>
        <p>Iron Tipping.</p>
      </a>
      <div id="hora" class="clock">⏰ 00:00:00</div>
      <div id="user-area" class="user-area hidden">
        <div class="user-badge">
          <img id="user-avatar" class="user-avatar" src="" alt="avatar">
          <span id="user-name" class="user-name">Usuário</span>
        </div>
        <button class="btn btn-icon btn-ghost logout-btn" id="logout-btn" title="Sair">
          <span class="material-symbols-outlined" style="font-size:18px;">logout</span>
          <span>Sair</span>
        </button>
      </div>
    </header>

    <div id="content">
      <div id="side_bar" class="sidenav">
        <div class="nav-header">
          <span id="openMenu" class="material-symbols-outlined" onclick="openNav()" title="Expandir menu">menu</span>
          <span id="closeMenu" class="material-symbols-outlined" onclick="closeNav()" title="Recolher">keyboard_double_arrow_left</span>
        </div>

        <nav class="nav-list">
          <a class="nav-item active" href="./pages/welcome.html" target="iframe_a">
            <span class="material-symbols-outlined">home</span>
            <span class="nav-label">Home</span>
          </a>
          <a class="nav-item" href="./pages/aplic.html" target="iframe_a">
            <span class="material-symbols-outlined">dynamic_feed</span>
            <span class="nav-label">Links</span>
          </a>
          <a class="nav-item" href="./pages/Anotação.html" target="iframe_a">
            <span class="material-symbols-outlined">chrome_reader_mode</span>
            <span class="nav-label">Notas</span>
          </a>
          <a class="nav-item" href="./pages/tips.html" target="iframe_a">
            <span class="material-symbols-outlined">view_compact_alt</span>
            <span class="nav-label">Base</span>
          </a>
          <a class="nav-item" href="https://josecassiosantos.github.io/jsonteste/" target="iframe_a">
            <span class="material-symbols-outlined">calendar_month</span>
            <span class="nav-label">Mudanças</span>
          </a>
          <a class="nav-item" href="https://josecassiosantos.github.io/gmud-hub/" target="iframe_a">
            <span class="material-symbols-outlined">mail</span>
            <span class="nav-label">E-mails</span>
          </a>
          <a class="nav-item" href="./pages/contato.html" target="iframe_a">
            <span class="material-symbols-outlined">help_center</span>
            <span class="nav-label">Sobre</span>
          </a>
        </nav>

        <div class="nav-divider"></div>
        <div class="nav-section">Sistema</div>
        <button class="nav-item" onclick="overOn()" title="Relógio">
          <span class="material-symbols-outlined">access_time</span>
          <span class="nav-label">Relógio</span>
        </button>
        <button class="nav-item" id="btnfull" onclick="full()" title="Tela cheia" style="display:none;">
          <span class="material-symbols-outlined">fullscreen</span>
          <span class="nav-label">Tela Cheia</span>
        </button>
        <button class="nav-item" id="btnffull" onclick="nfull()" title="Sair tela cheia" style="display:none;">
          <span class="material-symbols-outlined">fullscreen_exit</span>
          <span class="nav-label">Fechar Tela Cheia</span>
        </button>
      </div>

      <section id="content-frame">
        <iframe src="./pages/welcome.html" name="iframe_a" height="100%" width="100%" frameborder="0"></iframe>
      </section>
    </div>

    <footer>
      <div class="window-controls">
        <button class="btn btn-icon btn-ghost" onclick="electronAPI.minimize()" title="Minimizar">
          <span class="material-symbols-outlined" style="font-size:16px;">remove</span>
        </button>
        <button class="btn btn-icon btn-ghost" onclick="toggleMaximize()" title="Maximizar/Restaurar">
          <span class="material-symbols-outlined" id="max-icon" style="font-size:16px;">square</span>
        </button>
        <button class="btn btn-icon btn-ghost" onclick="electronAPI.close()" title="Fechar">
          <span class="material-symbols-outlined" style="font-size:16px;">close</span>
        </button>
      </div>
      <span class="infor">
        <p>ver.2.0.0 &middot; <span id="footer-version">-</span></p>
      </span>
    </footer>
  </div>

  <div id="overlay" onclick="overOff()">
    <div class="logo2">
      <p id="iron">Iron</p>
      <p id="tipping">Tipping</p>
    </div>
    <div id="overhora"></div>
    <div id="overdata"></div>
  </div>

</body>

</html>
